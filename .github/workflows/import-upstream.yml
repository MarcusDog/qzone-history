name: Import upstream qzone-history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import upstream source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/kirklin/qzone-history.git
          git fetch --depth=1 upstream main
          git checkout FETCH_HEAD -- .
          git add -A
          git commit -m "chore: import kirklin/qzone-history" || exit 0
          git push origin HEAD:main
